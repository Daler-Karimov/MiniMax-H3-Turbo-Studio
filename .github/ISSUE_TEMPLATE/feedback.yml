name: Feedback / 反馈
description: Describe what could be improved / 请说明哪些方面可以改进
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Suggested improvements / 改进建议
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic info (optional) / 诊断信息（选填）
